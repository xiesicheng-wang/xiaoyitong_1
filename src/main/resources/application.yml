server:
  port: 8080

spring:
  application:
    name: youlinbang
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # TODO: 先在 MySQL 里执行 CREATE DATABASE youlinbang DEFAULT CHARACTER SET utf8mb4;
    #       密码通过环境变量 MYSQL_PASSWORD 注入，不要把真实密码提交到 git
    # Connector/J 9.x 用 Java 字符集名 UTF-8，连接 MySQL 时自动映射 utf8mb4
    url: jdbc:mysql://localhost:3306/youlinbang?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志走 logback（logback-spring.xml），不再用 StdOutImpl 刷屏
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义配置
youlinbang:
  jwt:
    # TODO: 生产环境用环境变量注入，长度需 >= 256bit
    secret: ${JWT_SECRET:youlinbang-dev-secret-key-change-me-in-production-0123456789abcdef}
    expire-hours: 24
  minio:
    endpoint: http://127.0.0.1:9000
    access-key: ${MINIO_USER:minioadmin}
    secret-key: ${MINIO_PASSWORD:minioadmin}
    bucket: youlinbang
  order:
    # 履约截止分钟数：超时未完成判买家违约（演示期可调小）
    timeout-minutes: 30
    # 违约金比例（%），从买家冻结款扣除给卖家
    penalty-percent: 20
  upload:
    max-size-mb: 5
    allowed-types: image/jpeg,image/png,image/webp,image/gif
