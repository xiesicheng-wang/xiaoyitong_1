server:
  port: 8080

spring:
  application:
    name: youlinbang
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # TODO: 先在 MySQL 里执行 CREATE DATABASE youlinbang DEFAULT CHARACTER SET utf8mb4;
    #       密码通过环境变量 MYSQL_PASSWORD 注入，不要把真实密码提交到 git
    url: jdbc:mysql://localhost:3306/youlinbang?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 自定义配置
youlinbang:
  jwt:
    # TODO: 生产环境用环境变量注入，长度需 >= 256bit
    secret: ${JWT_SECRET:youlinbang-dev-secret-key-change-me-in-production-0123456789abcdef}
    expire-hours: 72
